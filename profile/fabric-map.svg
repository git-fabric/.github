<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d">
  <title id="t">The git-fabric map</title>
  <desc id="d">Consumers (git-steer, cortex, Claude Desktop, GitHub Actions) call the gateway and fabric-sdk routing layer, which routes to ten fabric apps (aiana, chat, cloudflare, cve, git, k8s, proxmox, sandfly, tailscale, unifi) backed by fourteen specialized Ollama models in the fabric-llm layer. Claude is called only when nothing else can answer.</desc>
  <defs><path id="c0" d="M200 82C200 104 450 98 450 120"/><path id="c1" d="M350 82C350 104 450 98 450 120"/><path id="c2" d="M500 82C500 104 450 98 450 120"/><path id="c3" d="M650 82C650 104 450 98 450 120"/><path id="esc" d="M710 144H790"/><path id="a0" d="M430 168C430 196 150 200 150 232"/><path id="a1" d="M430 168C430 196 290 200 290 232"/><path id="a2" d="M430 168C430 196 430 200 430 232"/><path id="a3" d="M430 168C430 196 570 200 570 232"/><path id="a4" d="M430 168C430 196 710 200 710 232"/><path id="a5" d="M430 168C430 196 150 200 150 276"/><path id="a6" d="M430 168C430 196 290 200 290 276"/><path id="a7" d="M430 168C430 196 430 200 430 276"/><path id="a8" d="M430 168C430 196 570 200 570 276"/><path id="a9" d="M430 168C430 196 710 200 710 276"/></defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .links use{fill:none;stroke:#30363d;stroke-width:1.5}
    .esc{fill:none;stroke:#d97757;stroke-width:2;stroke-dasharray:5 6;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-22}}
    .mdl{animation:mdl 2.8s ease-in-out infinite}@keyframes mdl{0%,100%{stroke-opacity:.35}30%{stroke-opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
  </style>
  <rect x="1" y="1" width="898" height="448" rx="16" fill="#0d1117" stroke="#30363d"/>
  <g class="links"><use href='#a0'/><use href='#a1'/><use href='#a2'/><use href='#a3'/><use href='#a4'/><use href='#a5'/><use href='#a6'/><use href='#a7'/><use href='#a8'/><use href='#a9'/></g>
  <use href="#c0" fill="none" stroke="#30363d" stroke-width="1.5"/><use href="#c1" fill="none" stroke="#30363d" stroke-width="1.5"/><use href="#c2" fill="none" stroke="#30363d" stroke-width="1.5"/><use href="#c3" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="24" y="40" font-size="11.5" fill="#8b949e">CONSUMERS</text><rect class="" x="152" y="52" width="96" height="30" rx="15" fill="#161b22" stroke="#484f58" stroke-width="1.5"/><text x="200" y="72" text-anchor="middle" font-size="12.5" fill="#e6edf3">git-steer</text><rect class="" x="314" y="52" width="72" height="30" rx="15" fill="#161b22" stroke="#484f58" stroke-width="1.5"/><text x="350" y="72" text-anchor="middle" font-size="12.5" fill="#e6edf3">cortex</text><rect class="" x="432" y="52" width="136" height="30" rx="15" fill="#161b22" stroke="#484f58" stroke-width="1.5"/><text x="500" y="72" text-anchor="middle" font-size="12.5" fill="#e6edf3">Claude Desktop</text><rect class="" x="582" y="52" width="136" height="30" rx="15" fill="#161b22" stroke="#484f58" stroke-width="1.5"/><text x="650" y="72" text-anchor="middle" font-size="12.5" fill="#e6edf3">GitHub Actions</text><rect x="150" y="120" width="560" height="48" rx="12" fill="#1d1530" stroke="#a371f7" stroke-width="2"/><text x="430" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">gateway · fabric-sdk</text><text x="430" y="159" text-anchor="middle" font-size="11.5" fill="#c9b8f5">BGP-style routing · local first, Claude last</text><use href="#esc" class="esc"/><rect x="790" y="126" width="90" height="36" rx="18" fill="#161b22" stroke="#d97757" stroke-width="2"/><text x="835" y="149" text-anchor="middle" font-size="13" fill="#e6edf3">claude</text><text x="750" y="186" text-anchor="middle" font-size="10.5" fill="#8b949e">only if nobody</text><text x="750" y="199" text-anchor="middle" font-size="10.5" fill="#8b949e">else can answer</text><text x="24" y="218" font-size="11.5" fill="#8b949e">FABRIC APPS</text><rect class="app" x="96" y="232" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="150" y="252" text-anchor="middle" font-size="12.5" fill="#e6edf3">aiana</text><rect class="app" x="236" y="232" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="290" y="252" text-anchor="middle" font-size="12.5" fill="#e6edf3">chat</text><rect class="app" x="376" y="232" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="430" y="252" text-anchor="middle" font-size="12.5" fill="#e6edf3">cloudflare</text><rect class="app" x="516" y="232" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="570" y="252" text-anchor="middle" font-size="12.5" fill="#e6edf3">cve</text><rect class="app" x="656" y="232" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="710" y="252" text-anchor="middle" font-size="12.5" fill="#e6edf3">git</text><rect class="app" x="96" y="276" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="150" y="296" text-anchor="middle" font-size="12.5" fill="#e6edf3">k8s</text><rect class="app" x="236" y="276" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="290" y="296" text-anchor="middle" font-size="12.5" fill="#e6edf3">proxmox</text><rect class="app" x="376" y="276" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="430" y="296" text-anchor="middle" font-size="12.5" fill="#e6edf3">sandfly</text><rect class="app" x="516" y="276" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="570" y="296" text-anchor="middle" font-size="12.5" fill="#e6edf3">tailscale</text><rect class="app" x="656" y="276" width="108" height="30" rx="15" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/><text x="710" y="296" text-anchor="middle" font-size="12.5" fill="#e6edf3">unifi</text><text x="24" y="340" font-size="11.5" fill="#8b949e">FABRIC-LLM</text><rect x="150" y="352" width="560" height="44" rx="12" fill="#0f1a2b" stroke="#58a6ff" stroke-width="1.5"/><rect class="mdl" style="animation-delay:0.0s" x="172" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:0.2s" x="210" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:0.4s" x="248" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:0.6s" x="286" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:0.8s" x="324" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:1.0s" x="362" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:1.2s" x="400" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:1.4s" x="438" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:1.6s" x="476" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:1.8s" x="514" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:2.0s" x="552" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:2.2s" x="590" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:2.4s" x="628" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><rect class="mdl" style="animation-delay:2.6s" x="666" y="364" width="22" height="20" rx="4" fill="#161b22" stroke="#58a6ff"/><text x="430" y="420" text-anchor="middle" font-size="12" fill="#8b949e">14 Ollama models, each specialized for one API, answer locally before anything escalates</text>
