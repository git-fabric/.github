<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="weave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#da3633;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#f85149;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#58a6ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="weave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#bc8cff;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#e3b341;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#da3633;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#bc8cff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="240" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#21262d" stroke-width="0.5" opacity="0.4" clip-path="url(#clip)">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="540" y1="0" x2="540" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- Animated weave lines (the "fabric") -->
  <g clip-path="url(#clip)" opacity="0.6">
    <!-- Thread 1 -->
    <path d="M-100,70 Q150,40 300,70 Q450,100 600,70 Q750,40 900,70 Q1050,100 1200,70" fill="none" stroke="url(#weave-1)" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- Thread 2 -->
    <path d="M-100,90 Q150,120 300,90 Q450,60 600,90 Q750,120 900,90 Q1050,60 1200,90" fill="none" stroke="url(#weave-2)" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <!-- Thread 3 -->
    <path d="M-100,110 Q150,80 300,110 Q450,140 600,110 Q750,80 900,110 Q1050,140 1200,110" fill="none" stroke="url(#weave-1)" stroke-width="1" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Left side: Fabric weave icon -->
  <g transform="translate(40, 55)" filter="url(#glow)">
    <!-- Warp threads (vertical) -->
    <line x1="20" y1="5" x2="20" y2="85" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="40" y1="5" x2="40" y2="85" stroke="#3fb950" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="60" y1="5" x2="60" y2="85" stroke="#bc8cff" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="80" y1="5" x2="80" y2="85" stroke="#f85149" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </line>
    <!-- Weft threads (horizontal, weaving) -->
    <path d="M5,20 Q20,12 20,20 Q20,28 40,20 Q60,12 60,20 Q60,28 80,20 Q100,12 95,20" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M5,45 Q20,53 20,45 Q20,37 40,45 Q60,53 60,45 Q60,37 80,45 Q100,53 95,45" fill="none" stroke="#da3633" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
    </path>
    <path d="M5,70 Q20,62 20,70 Q20,78 40,70 Q60,62 60,70 Q60,78 80,70 Q100,62 95,70" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite" begin="1.3s"/>
    </path>
    <!-- Node dots at intersections -->
    <circle cx="20" cy="20" r="3" fill="#e3b341">
      <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="45" r="3" fill="#da3633">
      <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="40" cy="70" r="3" fill="#58a6ff">
      <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
  </g>

  <!-- Divider -->
  <line x1="160" y1="35" x2="160" y2="200" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="188" y="85" font-family="'SF Mono', 'Fira Code', monospace" font-size="44" font-weight="700" fill="#f0f6fc" letter-spacing="-1">git-fabric</text>

  <!-- Tagline -->
  <text x="190" y="112" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#8b949e" letter-spacing="0.5">Composable fabric apps for Git-native infrastructure</text>

  <!-- Accent bar -->
  <rect x="188" y="122" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="480" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- App pills -->
  <g transform="translate(188, 140)">
    <rect x="0" y="0" width="56" height="26" rx="13" fill="#da3633" opacity="0.2" stroke="#da3633" stroke-width="1"/>
    <text x="28" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#f85149" text-anchor="middle">cve</text>

    <rect x="64" y="0" width="84" height="26" rx="13" fill="#58a6ff" opacity="0.2" stroke="#1f6feb" stroke-width="1"/>
    <text x="106" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#58a6ff" text-anchor="middle">gateway</text>

    <rect x="156" y="0" width="38" height="26" rx="13" fill="#30363d" opacity="0.4" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="175" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#484f58" text-anchor="middle">...</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="206" width="900" height="34" rx="0" fill="#161b22" opacity="0.8" clip-path="url(#clip)"/>
  <rect x="0" y="206" width="900" height="1" fill="#30363d"/>

  <text x="188" y="227" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e">Built to be consumed  •  by </text>
  <text x="402" y="227" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#58a6ff">ry-ops</text>
</svg>
